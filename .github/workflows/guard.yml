name: Guard

# Path-based trust boundary. A PR is "allowlisted" only if every changed file is
# within the machine's own zone (Lab posts + build machinery). Anything touching
# the core site, Wolf's writing/work, config, the engine's constitution
# (CYCLE.md), the leak guard (src/lib/sanitize*), or .github/** is flagged for
# Wolf's manual merge.
#
# WHY sanitize* is carved out of src/lib/*: src/lib/sanitize.core.mjs is the
# fail-closed secret scan every monitor report passes through before it is
# published, and src/lib/sanitize.test.ts is the only thing asserting it still
# fails closed. Left inside the allowlist, one machine-authored PR could weaken
# the scan AND relax the test that would have caught it, then merge itself on
# green CI with no human in the path. The arm sits BEFORE the allowlist arm so it
# wins; the rest of src/lib/ (feed.ts, lab-filter.ts, tech-level.ts) stays in-zone.
#
# TIER SWITCH: this guard only auto-merges when the repo variable AUTONOMY_TIER
# is set to "B" (Tier B, hands-off). Unset/anything-else = Tier A: the guard
# LABELS ONLY and never merges — every PR waits for Wolf. This avoids the trap
# that `gh pr merge --auto` immediately merges a mergeable PR when there is no
# branch protection to wait behind. Tier B is only safe WITH branch protection
# requiring the `build` check (see engine/README.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  path-guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: List changed files
        id: files
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "Changed files:"; echo "$files"
          {
            echo "list<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate against allowlist
        id: guard
        # The file list arrives via env, never spliced into the script text. A
        # changed path containing a quote is then just data in "$LIST" — it can
        # fail the allowlist, but it can never be parsed as shell in the job
        # that decides whether a PR auto-merges.
        env:
          LIST: ${{ steps.files.outputs.list }}
        run: |
          allowed=1
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              engine/CYCLE.md) echo "protected (constitution): $f"; allowed=0 ;;
              src/lib/sanitize*) echo "protected (leak guard): $f"; allowed=0 ;;
              src/content/lab/*|engine/*|src/lib/*) ;;
              *) echo "protected: $f"; allowed=0 ;;
            esac
          done <<< "$LIST"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (allowlisted PRs, Tier B only)
        if: steps.guard.outputs.allowed == '1' && vars.AUTONOMY_TIER == 'B'
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash \
            || echo "Could not enable auto-merge — PR left open for manual merge."

      - name: Tier A — allowlisted, auto-merge OFF
        if: steps.guard.outputs.allowed == '1' && vars.AUTONOMY_TIER != 'B'
        run: echo "✅ Allowlisted PR. Tier A (AUTONOMY_TIER != B) — auto-merge is OFF; left open for your manual merge."

      - name: Flag protected PRs for human review
        if: steps.guard.outputs.allowed != '1'
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human || true
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🔒 This PR touches **protected paths** (core site / your content / engine constitution / leak guard / CI config). Auto-merge was **not** enabled — it needs your review and manual merge."
